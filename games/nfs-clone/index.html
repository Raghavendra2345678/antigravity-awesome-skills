<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Street Rush: Most Wanted</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Arial Black',Arial,sans-serif;touch-action:none;}
#c{display:block;width:100vw;height:100vh;}

/* HUD */
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
#speedo-wrap{position:absolute;bottom:20px;right:20px;}
#speedo-canvas{width:150px;height:150px;}
#nitro-label{color:#00ccff;font-size:10px;letter-spacing:2px;text-align:center;margin-top:4px;}
#nitro-track{width:150px;height:8px;background:rgba(0,0,0,0.5);border:1px solid #00ccff;border-radius:4px;overflow:hidden;}
#nitro-fill{height:100%;width:100%;background:linear-gradient(90deg,#0044ff,#00ccff);transition:width 0.05s;border-radius:4px;}

#heat-wrap{position:absolute;top:20px;right:20px;width:160px;}
#stars{font-size:22px;text-align:right;letter-spacing:4px;margin-bottom:6px;}
.star{transition:all 0.3s;}
#heat-label{color:#ff4400;font-size:10px;letter-spacing:2px;text-align:right;margin-bottom:4px;}
#heat-track{width:100%;height:10px;background:rgba(0,0,0,0.5);border:1px solid #ff4400;border-radius:5px;overflow:hidden;}
#heat-fill{height:100%;width:0%;background:#ff0000;border-radius:5px;transition:width 0.1s;}

#minimap-wrap{position:absolute;bottom:20px;left:20px;}
#minimap{width:120px;height:120px;border:1px solid rgba(255,100,0,0.5);border-radius:4px;}
#minimap-label{color:rgba(255,100,0,0.6);font-size:9px;letter-spacing:2px;text-align:center;margin-top:2px;}

#km-display{position:absolute;bottom:185px;right:20px;width:150px;text-align:center;color:#ff6600;font-size:12px;letter-spacing:1px;}

/* Busted flash */
#busted{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.5);z-index:50;pointer-events:none;opacity:0;transition:opacity 0.3s;display:flex;align-items:center;justify-content:center;}
#busted h1{color:#fff;font-size:60px;text-shadow:0 0 30px #ff0000;letter-spacing:10px;}

/* Nitro flash */
#nitro-flash{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,100,255,0.15);z-index:5;pointer-events:none;opacity:0;transition:opacity 0.1s;}

/* Start screen */
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#000000,#0a0a1f,#1a0000);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#splash h2{color:#ff4400;font-size:14px;letter-spacing:8px;margin-bottom:8px;text-shadow:0 0 20px #ff4400;}
#splash h1{color:#ff6600;font-size:clamp(36px,8vw,80px);letter-spacing:6px;text-shadow:0 0 40px #ff6600,0 0 80px #ff6600;margin-bottom:6px;}
#splash .sub{color:#ffaa44;font-size:clamp(10px,2vw,16px);letter-spacing:12px;margin-bottom:50px;}
.car-art{font-size:clamp(40px,10vw,90px);margin-bottom:40px;filter:drop-shadow(0 0 20px #ff6600);}
#start-btn{background:transparent;border:2px solid #ff6600;color:#ff6600;font-size:18px;letter-spacing:4px;padding:14px 50px;cursor:pointer;font-family:'Arial Black',Arial,sans-serif;transition:all 0.2s;text-transform:uppercase;}
#start-btn:hover{background:#ff6600;color:#000;}
.controls-hint{color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:2px;margin-top:30px;text-align:center;line-height:2;}

/* Mobile controls */
#mobile-controls{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;}
/* Left half = joystick zone */
#left-zone{position:absolute;left:0;top:0;width:52%;height:100%;pointer-events:all;}
/* Dynamic joystick — hidden until finger touches */
#jbase{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.12s;pointer-events:none;transform:translate(-50%,-50%);}
#jbase.active{opacity:1;}
#jknob{width:60px;height:60px;border-radius:50%;background:rgba(255,100,0,0.88);border:2.5px solid #ff6600;position:absolute;will-change:transform;box-shadow:0 0 12px rgba(255,100,0,0.6);}
/* Right side = action buttons */
#right-zone{position:absolute;right:18px;bottom:28px;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:all;}
.mbtn{border-radius:50%;border:2px solid;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;display:flex;align-items:center;justify-content:center;font-family:'Arial Black',Arial,sans-serif;letter-spacing:1px;transition:transform 0.07s,filter 0.07s;}
.mbtn:active,.mbtn.active{transform:scale(0.88);filter:brightness(1.6);}
#gas-btn{width:92px;height:92px;background:rgba(0,180,0,0.28);border-color:#00cc00;color:#00ff44;font-size:14px;box-shadow:inset 0 0 20px rgba(0,200,0,0.15);}
#brake-btn{width:68px;height:68px;background:rgba(200,0,0,0.28);border-color:#cc0000;color:#ff5555;font-size:11px;}
#nitro-btn{width:74px;height:74px;background:rgba(0,80,255,0.28);border-color:#0055ff;color:#44aaff;font-size:11px;box-shadow:inset 0 0 16px rgba(0,100,255,0.15);}
/* HUD repositioning on touch devices */
body.touch-ui #minimap-wrap{top:16px;left:16px;bottom:auto;}
body.touch-ui #speedo-wrap{bottom:240px;right:14px;}
body.touch-ui #speedo-canvas{width:120px;height:120px;}
body.touch-ui #nitro-track{width:120px;}
body.touch-ui #km-display{bottom:430px;right:14px;width:120px;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="heat-wrap">
    <div id="stars">
      <span class="star" style="color:#333">★</span>
      <span class="star" style="color:#333">★</span>
      <span class="star" style="color:#333">★</span>
      <span class="star" style="color:#333">★</span>
      <span class="star" style="color:#333">★</span>
    </div>
    <div id="heat-label">HEAT LEVEL</div>
    <div id="heat-track"><div id="heat-fill"></div></div>
  </div>
  <div id="km-display">— km/h</div>
  <div id="speedo-wrap">
    <canvas id="speedo-canvas" width="150" height="150"></canvas>
    <div id="nitro-label">NITRO</div>
    <div id="nitro-track"><div id="nitro-fill"></div></div>
  </div>
  <div id="minimap-wrap">
    <canvas id="minimap" width="120" height="120"></canvas>
    <div id="minimap-label">MAP</div>
  </div>
</div>

<div id="busted"><h1>BUSTED!</h1></div>
<div id="nitro-flash"></div>

<div id="mobile-controls">
  <div id="left-zone">
    <div id="jbase"><div id="jknob"></div></div>
  </div>
  <div id="right-zone">
    <button class="mbtn" id="nitro-btn">N2O</button>
    <button class="mbtn" id="brake-btn">BRAKE</button>
    <button class="mbtn" id="gas-btn">GAS</button>
  </div>
</div>

<div id="splash">
  <div class="car-art">🏎</div>
  <h2>STREET RUSH</h2>
  <h1>MOST WANTED</h1>
  <div class="sub">NEXT GEN EDITION</div>
  <button id="start-btn">START ENGINE</button>
  <div class="controls-hint" id="ctrl-hint">
    WASD / ARROW KEYS · N or SPACE = NITRO
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── CONSTANTS ──────────────────────────────────────────────────────
const BLOCK      = 80;
const ROAD       = 20;
const BLOCKS     = 8;
const CITY       = BLOCKS * (BLOCK + ROAD) + ROAD;
const HALF_CITY  = CITY / 2;
const CAR_HALF_W = 2.2;
const CAR_HALF_L = 4.2;

const MAX_SPEED   = 2.4;
const ACCEL       = 0.055;
const BRAKE_POWER = 0.12;
const REVERSE_MAX = 0.6;
const FRICTION    = 0.016;
const STEER_MAX   = 0.038;
const DRIFT       = 0.88;
const NITRO_ACCEL = 0.14;
const NITRO_DRAIN = 0.006;
const NITRO_REGEN = 0.0008;

const POLICE_BASE_SPEED = 1.5;
const POLICE_MAX        = 6;
const POLICE_SPAWN_DIST = 220;
const POLICE_DESPAWN    = 500;

const CAM_HEIGHT = 13;
const CAM_BACK   = 24;
const CAM_LERP   = 0.09;

// ── MOBILE DETECTION ───────────────────────────────────────────────
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if(isMobile){
  document.body.classList.add('touch-ui');
  document.getElementById('mobile-controls').style.display='block';
  // Prevent page scroll/zoom during gameplay
  document.addEventListener('touchmove', e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false});
}

// ── RENDERER ───────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference:'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(isMobile ? Math.min(devicePixelRatio, 1.5) : Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = !isMobile; // disable shadows on mobile for perf
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.75;

// ── SCENE ──────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x060610);
scene.fog = new THREE.Fog(0x060610, 80, 380);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, CAM_HEIGHT, -CAM_BACK);
const camPos    = new THREE.Vector3(0, CAM_HEIGHT, -CAM_BACK);
const camTarget = new THREE.Vector3(0, 2, 10);

// ── LIGHTING ───────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a1a30, 2));

const moon = new THREE.DirectionalLight(0x3355aa, 1.2);
moon.position.set(60, 120, 40);
moon.castShadow = true;
moon.shadow.mapSize.setScalar(isMobile ? 512 : 2048);
moon.shadow.camera.left = moon.shadow.camera.bottom = -300;
moon.shadow.camera.right = moon.shadow.camera.top  =  300;
moon.shadow.camera.far = 600;
scene.add(moon);

// ── CITY GENERATION ────────────────────────────────────────────────
const buildingBounds = [];

function windowTex() {
  const tc = document.createElement('canvas');
  tc.width = 128; tc.height = 256;
  const ctx = tc.getContext('2d');
  ctx.fillStyle = '#101820';
  ctx.fillRect(0,0,128,256);
  const cols=4, rows=8, ww=22, wh=26;
  const gx=(128-cols*ww)/(cols+1), gy=(256-rows*wh)/(rows+1);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
    if(Math.random()>0.28){
      const br=0.5+Math.random()*0.5;
      ctx.fillStyle=`rgba(255,${Math.floor(200+40*br)},${Math.floor(80+30*br)},${0.7+br*0.3})`;
      ctx.fillRect(gx+c*(ww+gx), gy+r*(wh+gy), ww, wh);
    }
  }
  return new THREE.CanvasTexture(tc);
}

const roadMat   = new THREE.MeshLambertMaterial({color:0x151515});
const dashMat   = new THREE.MeshBasicMaterial({color:0xddcc44});
const sidewalkM = new THREE.MeshLambertMaterial({color:0x222018});

function buildCity() {
  // Ground
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(CITY+400, CITY+400), new THREE.MeshLambertMaterial({color:0x0d0d0d}));
  gnd.rotation.x = -Math.PI/2;
  gnd.receiveShadow = true;
  scene.add(gnd);

  const off = -HALF_CITY;

  // Horizontal roads
  for(let r=0; r<=BLOCKS; r++){
    const z = off + r*(BLOCK+ROAD) + ROAD/2;
    addRoad(0, z, CITY, ROAD, 'h');
  }
  // Vertical roads
  for(let c=0; c<=BLOCKS; c++){
    const x = off + c*(BLOCK+ROAD) + ROAD/2;
    addRoad(x, 0, ROAD, CITY, 'v');
  }
  // Blocks
  for(let r=0; r<BLOCKS; r++) for(let c=0; c<BLOCKS; c++){
    const bx = off + c*(BLOCK+ROAD) + ROAD + BLOCK/2;
    const bz = off + r*(BLOCK+ROAD) + ROAD + BLOCK/2;
    buildBlock(bx, bz);
  }
  // Street lights
  for(let r=0; r<=BLOCKS; r++) for(let c=0; c<=BLOCKS; c++){
    const lx = off + c*(BLOCK+ROAD);
    const lz = off + r*(BLOCK+ROAD);
    addStreetLight(lx, lz);
  }
}

function addRoad(cx, cz, w, d, dir){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d), roadMat);
  mesh.position.set(cx, 0.06, cz);
  mesh.receiveShadow = true;
  scene.add(mesh);
  // Sidewalk edges
  const sw = 1.5;
  if(dir==='h'){
    [-1,1].forEach(s=>{
      const sm = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, sw), sidewalkM);
      sm.position.set(cx, 0.1, cz + s*(ROAD/2-sw/2));
      scene.add(sm);
    });
    // Dashes
    const n = Math.floor(w/12);
    for(let i=0;i<n;i++){
      const dm = new THREE.Mesh(new THREE.BoxGeometry(5,0.01,0.3), dashMat);
      dm.position.set(cx - w/2 + i*12 + 6, 0.13, cz);
      scene.add(dm);
    }
  } else {
    [-1,1].forEach(s=>{
      const sm = new THREE.Mesh(new THREE.BoxGeometry(sw, 0.2, d), sidewalkM);
      sm.position.set(cx + s*(ROAD/2-sw/2), 0.1, cz);
      scene.add(sm);
    });
    const n = Math.floor(d/12);
    for(let i=0;i<n;i++){
      const dm = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.01,5), dashMat);
      dm.position.set(cx, 0.13, cz - d/2 + i*12 + 6);
      scene.add(dm);
    }
  }
}

const buildingColors = [0x1a2535,0x202030,0x151a25,0x1c2020,0x252522,0x1a1520,0x102018];
const tex = windowTex();
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

function buildBlock(cx, cz){
  const pad = 4;
  const avW = BLOCK - pad*2;
  const avD = BLOCK - pad*2;
  const count = 1 + Math.floor(Math.random()*2);
  const byCol = Math.random()>0.5;
  const divW = byCol ? count : 1;
  const divD = byCol ? 1 : count;

  for(let r=0; r<divD; r++) for(let c=0; c<divW; c++){
    const bw = avW/divW - 2;
    const bd = avD/divD - 2;
    const px = cx - avW/2 + c*(avW/divW) + avW/divW/2;
    const pz = cz - avD/2 + r*(avD/divD) + avD/divD/2;
    const h  = 8 + Math.random()*55;
    const col= buildingColors[Math.floor(Math.random()*buildingColors.length)];

    const bt = tex.clone();
    bt.needsUpdate = true;
    bt.repeat.set(Math.max(1,Math.round(bw/12)), Math.max(1,Math.round(h/14)));

    const mat = new THREE.MeshLambertMaterial({color:col, map:bt});
    const top = new THREE.MeshLambertMaterial({color:col});
    const mats = [mat,mat,top,top,mat,mat];

    const mesh = new THREE.Mesh(new THREE.BoxGeometry(bw,h,bd), mats);
    mesh.position.set(px, h/2, pz);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    buildingBounds.push({cx:px, cz:pz, hw:bw/2+0.5, hd:bd/2+0.5});

    // Rooftop accent
    if(h > 30 && Math.random()>0.5){
      const atMat = new THREE.MeshBasicMaterial({color:Math.random()>0.5?0xff2200:0x0044ff});
      const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,6), atMat);
      ant.position.set(px + (Math.random()-0.5)*bw*0.3, h+3, pz + (Math.random()-0.5)*bd*0.3);
      scene.add(ant);
    }
  }
}

function addStreetLight(x, z){
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,9), new THREE.MeshLambertMaterial({color:0x333333}));
  pole.position.set(x, 4.5, z);
  scene.add(pole);
  const head = new THREE.Mesh(new THREE.BoxGeometry(2,0.35,0.7), new THREE.MeshBasicMaterial({color:0xffffcc}));
  head.position.set(x, 9.2, z);
  scene.add(head);
  const pl = new THREE.PointLight(0xffee88, 1.2, 45);
  pl.position.set(x, 9, z);
  scene.add(pl);
}

// ── CAR BUILDER ────────────────────────────────────────────────────
function makeCar(bodyColor, isPolice=false){
  const g = new THREE.Group();
  const bMat = new THREE.MeshLambertMaterial({color:bodyColor});
  const dMat = new THREE.MeshLambertMaterial({color:isPolice?0x0a0a18:0x111111});
  const wMat = new THREE.MeshLambertMaterial({color:0x080808});
  const rMat = new THREE.MeshLambertMaterial({color:0xcccccc});

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(4,1.3,8.5), bMat);
  body.position.y = 0.65; body.castShadow = true;
  g.add(body);

  // Cabin
  const cab = new THREE.Mesh(new THREE.BoxGeometry(3.3,1,4.5), dMat);
  cab.position.set(0,1.8,0.3); cab.castShadow = true;
  g.add(cab);

  // Windshield tint
  const wsMat = new THREE.MeshBasicMaterial({color:0x223344, transparent:true, opacity:0.7});
  const ws = new THREE.Mesh(new THREE.BoxGeometry(3.1,0.8,0.1), wsMat);
  ws.position.set(0,1.85,2.5);
  g.add(ws);
  const rw = new THREE.Mesh(new THREE.BoxGeometry(3.1,0.8,0.1), wsMat);
  rw.position.set(0,1.85,-1.9);
  g.add(rw);

  // Front bumper
  const fBump = new THREE.Mesh(new THREE.BoxGeometry(4,0.4,0.6), dMat);
  fBump.position.set(0,0.3,4.55);
  g.add(fBump);

  // Rear bumper + diffuser
  const rBump = new THREE.Mesh(new THREE.BoxGeometry(4,0.4,0.6), dMat);
  rBump.position.set(0,0.3,-4.55);
  g.add(rBump);

  // Rear wing
  const wingSpar = new THREE.Mesh(new THREE.BoxGeometry(3.6,0.12,0.5), dMat);
  wingSpar.position.set(0,1.85,-4.1);
  g.add(wingSpar);
  [-1.6,1.6].forEach(x=>{
    const ws2 = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.55,0.45), dMat);
    ws2.position.set(x,1.55,-4.1);
    g.add(ws2);
  });

  // Side skirts
  [-2.1,2.1].forEach(x=>{
    const sk = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.25,7), dMat);
    sk.position.set(x,0.15,0);
    g.add(sk);
  });

  // Headlights
  const hlMat = new THREE.MeshBasicMaterial({color:0xffffff});
  [-1.3,1.3].forEach(x=>{
    const hl = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.4,0.15), hlMat);
    hl.position.set(x,0.8,4.35);
    g.add(hl);
    // DRL strip
    const drl = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.08,0.12), new THREE.MeshBasicMaterial({color:0xaaddff}));
    drl.position.set(x,0.52,4.36);
    g.add(drl);
  });

  // Tail lights
  const tlMat = new THREE.MeshBasicMaterial({color:0xff1100});
  [-1.3,1.3].forEach(x=>{
    const tl = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.4,0.15), tlMat);
    tl.position.set(x,0.8,-4.35);
    g.add(tl);
  });

  // Wheels
  const wheels = [];
  [[-2.25,0,2.8],[2.25,0,2.8],[-2.25,0,-2.8],[2.25,0,-2.8]].forEach(([wx,wy,wz])=>{
    const wg = new THREE.Group();
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.72,0.72,0.55,14), wMat);
    tire.rotation.z = Math.PI/2;
    wg.add(tire);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.57,6), rMat);
    rim.rotation.z = Math.PI/2;
    wg.add(rim);
    // Hub
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.6,6), new THREE.MeshBasicMaterial({color:0xdddddd}));
    hub.rotation.z = Math.PI/2;
    wg.add(hub);
    wg.position.set(wx,wy,wz);
    g.add(wg);
    wheels.push(wg);
  });

  // Police lightbar
  let cops = null;
  if(isPolice){
    const barMesh = new THREE.Mesh(new THREE.BoxGeometry(2.8,0.3,0.6), new THREE.MeshLambertMaterial({color:0x222222}));
    barMesh.position.set(0,2.35,0.3);
    g.add(barMesh);
    const red = new THREE.PointLight(0xff0000, 3, 14);
    red.position.set(-0.9,2.6,0.3);
    g.add(red);
    const blue = new THREE.PointLight(0x0000ff, 3, 14);
    blue.position.set(0.9,2.6,0.3);
    g.add(blue);
    cops = {red, blue};

    // Interceptor details
    const barStripe = new THREE.Mesh(new THREE.BoxGeometry(4.1,0.18,2), new THREE.MeshLambertMaterial({color:0xffffff}));
    barStripe.position.set(0,1.32,0.3);
    g.add(barStripe);
  }

  // Headlight beam (SpotLight)
  const beam = new THREE.SpotLight(0xffffff, isPolice?2:3, 70, 0.28, 0.6);
  beam.position.set(0,1.2,4.5);
  beam.target.position.set(0,-1,30);
  g.add(beam);
  g.add(beam.target);

  g.userData = { wheels, cops, speed:0, heading:0, vel:new THREE.Vector3() };
  return g;
}

// ── PLAYER ─────────────────────────────────────────────────────────
const ps = {                      // player state
  pos: new THREE.Vector3(ROAD/4, 0.75, 0),
  heading: 0,
  speed: 0,
  vel: new THREE.Vector3(),
  nitro: 1,
  stunFrames: 0,
};
let playerCar;

function initPlayer(){
  playerCar = makeCar(0xff5500);
  playerCar.position.copy(ps.pos);
  scene.add(playerCar);
}

// ── POLICE ─────────────────────────────────────────────────────────
const cops = [];

function spawnCop(){
  if(cops.length >= POLICE_MAX) return;
  const angle = Math.random()*Math.PI*2;
  const px = ps.pos.x + Math.cos(angle)*POLICE_SPAWN_DIST;
  const pz = ps.pos.z + Math.sin(angle)*POLICE_SPAWN_DIST;
  const snapped = nearestRoadPoint(px, pz);
  const m = makeCar(0x1133aa, true);
  m.position.set(snapped.x, 0.75, snapped.z);
  scene.add(m);
  cops.push({ m, heading: Math.random()*Math.PI*2, speed:0, vel:new THREE.Vector3(), stun:0, lt:0 });
}

function nearestRoadPoint(x, z){
  const off = -HALF_CITY;
  const period = BLOCK+ROAD;
  let best = {x, z};
  let bestD = Infinity;
  for(let r=0;r<=BLOCKS;r++){
    const rz = off + r*period + ROAD/2;
    const d = Math.abs(z-rz);
    if(d<bestD){ bestD=d; best={x:clamp(x,-HALF_CITY,HALF_CITY), z:rz}; }
  }
  for(let c=0;c<=BLOCKS;c++){
    const rx = off + c*period + ROAD/2;
    const d = Math.abs(x-rx);
    if(d<bestD){ bestD=d; best={x:rx, z:clamp(z,-HALF_CITY,HALF_CITY)}; }
  }
  return best;
}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ── INPUT ──────────────────────────────────────────────────────────
const K = {};
document.addEventListener('keydown', e=>{ K[e.key.toLowerCase()]=true; if(e.key===' ')e.preventDefault(); });
document.addEventListener('keyup',   e=>{ K[e.key.toLowerCase()]=false; });

// Separate joy and button states so they never override each other
const touch = { joyGas:false, joyBrake:false, btnGas:false, btnBrake:false, nitro:false,
                sx:0, sy:0, jid:null, jbx:0, jby:0 };

function initTouch(){
  if(!isMobile) return;
  const lz   = document.getElementById('left-zone');
  const jbase = document.getElementById('jbase');
  const jknob = document.getElementById('jknob');
  const MAX   = 62; // max knob travel px (half of jbase width)

  function startJoy(t){
    touch.jid = t.identifier;
    touch.jbx = t.clientX;
    touch.jby = t.clientY;
    const rect = lz.getBoundingClientRect();
    jbase.style.left = (t.clientX - rect.left) + 'px';
    jbase.style.top  = (t.clientY - rect.top)  + 'px';
    jbase.classList.add('active');
    jknob.style.transform = 'translate(0,0)';
  }

  lz.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(touch.jid !== null) return; // only one joystick touch at a time
    startJoy(e.changedTouches[0]);
  }, {passive:false});

  document.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){
      if(t.identifier !== touch.jid) continue;
      const dx = t.clientX - touch.jbx;
      const dy = t.clientY - touch.jby;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const cl   = Math.min(dist, MAX);
      const ang  = Math.atan2(dy, dx);
      const kx   = Math.cos(ang)*cl;
      const ky   = Math.sin(ang)*cl;
      jknob.style.transform = `translate(${kx}px,${ky}px)`;
      touch.sx       = kx / MAX;           // -1..1 (left/right steering)
      touch.sy       = ky / MAX;           // -1..1 (up=gas, down=brake)
      touch.joyGas   = touch.sy < -0.22;
      touch.joyBrake = touch.sy >  0.22;
    }
  }, {passive:false});

  function endJoy(id){
    if(id !== touch.jid) return;
    touch.jid = null;
    touch.sx = 0; touch.sy = 0;
    touch.joyGas = false; touch.joyBrake = false;
    jbase.classList.remove('active');
    jknob.style.transform = 'translate(0,0)';
  }
  document.addEventListener('touchend',    e=>{ for(const t of e.changedTouches) endJoy(t.identifier); });
  document.addEventListener('touchcancel', e=>{ for(const t of e.changedTouches) endJoy(t.identifier); });

  // Button helpers — separate props so joystick can't clobber them
  function btn(id, prop){
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e=>{ e.preventDefault(); touch[prop]=true;  el.classList.add('active'); }, {passive:false});
    el.addEventListener('touchend',   ()=>{ touch[prop]=false; el.classList.remove('active'); });
    el.addEventListener('touchcancel',()=>{ touch[prop]=false; el.classList.remove('active'); });
    // Mouse fallback (desktop testing)
    el.addEventListener('mousedown',  ()=>{ touch[prop]=true;  el.classList.add('active'); });
    el.addEventListener('mouseup',    ()=>{ touch[prop]=false; el.classList.remove('active'); });
  }
  btn('gas-btn','btnGas'); btn('brake-btn','btnBrake'); btn('nitro-btn','nitro');
}

// ── COLLISION ──────────────────────────────────────────────────────
function hitsBuilding(x, z, rw, rl){
  for(const b of buildingBounds){
    if(Math.abs(x-b.cx)<b.hw+rw && Math.abs(z-b.cz)<b.hd+rl) return true;
  }
  return false;
}

// ── GAME STATE ─────────────────────────────────────────────────────
let heat=0, wanted=0, spawnTimer=0, heatCoolTimer=0;
let gameGoing=false;
let shakeAmt=0;

// ── AUDIO ──────────────────────────────────────────────────────────
let actx=null, engOsc=null, engGain=null, nitroGain=null;
function startAudio(){
  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    engOsc=actx.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=80;
    engGain=actx.createGain(); engGain.gain.value=0.04;
    const filter=actx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=400;
    engOsc.connect(filter); filter.connect(engGain); engGain.connect(actx.destination);
    engOsc.start();
    nitroGain=actx.createGain(); nitroGain.gain.value=0;
    const nOsc=actx.createOscillator(); nOsc.type='square'; nOsc.frequency.value=200;
    nOsc.connect(nitroGain); nitroGain.connect(actx.destination);
    nOsc.start();
  }catch(e){}
}
function updateAudio(speedRatio, nitroOn){
  if(!actx)return;
  const f=80+speedRatio*240;
  engOsc.frequency.setTargetAtTime(f, actx.currentTime, 0.08);
  engGain.gain.setTargetAtTime(0.03+speedRatio*0.07, actx.currentTime, 0.08);
  if(nitroGain) nitroGain.gain.setTargetAtTime(nitroOn?0.015:0, actx.currentTime, 0.05);
}

// ── PLAYER PHYSICS ─────────────────────────────────────────────────
function updatePlayer(){
  if(ps.stunFrames>0){ ps.stunFrames--; ps.speed*=0.92; applyPlayerMesh(); return; }

  const gas   = K['w']||K['arrowup']   ||touch.joyGas  ||touch.btnGas;
  const brk   = K['s']||K['arrowdown'] ||touch.joyBrake||touch.btnBrake;
  const left  = K['a']||K['arrowleft'];
  const right = K['d']||K['arrowright'];
  const nitro = (K['n']||K[' ']||touch.nitro) && ps.nitro>0;

  // Nitro
  if(nitro){ ps.speed+=NITRO_ACCEL; ps.nitro=Math.max(0,ps.nitro-NITRO_DRAIN); }
  else       ps.nitro=Math.min(1,ps.nitro+NITRO_REGEN);

  // Throttle/brake
  if(gas) ps.speed+=ACCEL;
  else if(brk){
    if(ps.speed>0.01)       ps.speed-=BRAKE_POWER;
    else if(ps.speed>-REVERSE_MAX) ps.speed-=ACCEL*0.4;
  }

  ps.speed*=(1-FRICTION);
  ps.speed=clamp(ps.speed, -REVERSE_MAX, MAX_SPEED*(nitro?1.25:1));

  // Steer
  const spRatio=Math.abs(ps.speed)/MAX_SPEED;
  let steerVal=0;
  if(left)  steerVal= STEER_MAX;
  if(right) steerVal=-STEER_MAX;
  if(Math.abs(touch.sx)>0.08) steerVal=-touch.sx*STEER_MAX;
  if(ps.speed<0) steerVal=-steerVal;
  ps.heading+=steerVal*spRatio;

  // Velocity with drift
  const fwd=new THREE.Vector3(Math.sin(ps.heading),0,Math.cos(ps.heading)).multiplyScalar(ps.speed);
  ps.vel.lerp(fwd, DRIFT);

  const np=ps.pos.clone().add(ps.vel);
  np.x=clamp(np.x,-HALF_CITY+CAR_HALF_W,-(-HALF_CITY+CAR_HALF_W));
  np.z=clamp(np.z,-HALF_CITY+CAR_HALF_L,-(-HALF_CITY+CAR_HALF_L));

  if(!hitsBuilding(np.x,np.z,CAR_HALF_W,CAR_HALF_L)){
    ps.pos.copy(np); ps.pos.y=0.75;
  } else {
    ps.speed*=-0.35; ps.stunFrames=8; ps.vel.multiplyScalar(-0.35);
    shakeAmt=0.8;
  }

  applyPlayerMesh();
  updateNFSHeat(spRatio, nitro);
  updateAudio(spRatio, nitro);

  // Nitro FX
  document.getElementById('nitro-flash').style.opacity=nitro?'1':'0';
}

function applyPlayerMesh(){
  playerCar.position.copy(ps.pos);
  playerCar.rotation.y=ps.heading;
  const spin=ps.speed*0.55;
  playerCar.userData.wheels.forEach(w=>w.rotation.x+=spin);

  // Follow camera
  const spRatio=Math.abs(ps.speed)/MAX_SPEED;
  const back = new THREE.Vector3(-Math.sin(ps.heading)*CAM_BACK, CAM_HEIGHT+spRatio*3, -Math.cos(ps.heading)*CAM_BACK);
  camPos.lerp(ps.pos.clone().add(back), CAM_LERP);
  camTarget.lerp(ps.pos.clone().add(new THREE.Vector3(Math.sin(ps.heading)*12,2.5,Math.cos(ps.heading)*12)), CAM_LERP);
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
  camera.fov=68+spRatio*18;
  camera.updateProjectionMatrix();
}

// ── HEAT SYSTEM ────────────────────────────────────────────────────
function updateNFSHeat(spRatio, nitro){
  if(spRatio>0.55 || nitro) heat=Math.min(100, heat+0.04*(1+nitro*2));
  if(spRatio<0.05){ heatCoolTimer++; if(heatCoolTimer>90) heat=Math.max(0,heat-0.15); }
  else heatCoolTimer=0;

  const nw=Math.min(5,Math.floor(heat/20));
  if(nw!==wanted){ wanted=nw; updateStarsUI(); }

  spawnTimer++;
  if(wanted>0){
    const interval=Math.max(50,240-wanted*40);
    if(spawnTimer>=interval){ spawnTimer=0; spawnCop(); }
  }
  updateHUD(spRatio);
}

// ── POLICE AI ──────────────────────────────────────────────────────
function updateCops(){
  for(let i=cops.length-1;i>=0;i--){
    const cop=cops[i];
    cop.lt+=0.12;
    if(cop.m.userData.cops){
      cop.m.userData.cops.red.intensity  = Math.sin(cop.lt*6)>0 ? 3.5 : 0;
      cop.m.userData.cops.blue.intensity = Math.sin(cop.lt*6)>0 ? 0   : 3.5;
    }
    if(cop.stun>0){ cop.stun--; continue; }
    const dx=ps.pos.x-cop.m.position.x, dz=ps.pos.z-cop.m.position.z;
    const dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>POLICE_DESPAWN){ scene.remove(cop.m); cops.splice(i,1); continue; }

    const target=Math.atan2(dx,dz);
    let diff=target-cop.heading;
    while(diff> Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    cop.heading+=Math.sign(diff)*Math.min(Math.abs(diff),0.055);

    const topSpd=POLICE_BASE_SPEED*(1+wanted*0.1);
    cop.speed+=(topSpd-cop.speed)*0.04;

    const np=cop.m.position.clone().add(
      new THREE.Vector3(Math.sin(cop.heading),0,Math.cos(cop.heading)).multiplyScalar(cop.speed)
    );
    np.x=clamp(np.x,-HALF_CITY+2.5,HALF_CITY-2.5);
    np.z=clamp(np.z,-HALF_CITY+2.5,HALF_CITY-2.5);
    if(!hitsBuilding(np.x,np.z,2.2,4)) { cop.m.position.copy(np); cop.m.position.y=0.75; }
    else cop.heading+=0.28;

    cop.m.rotation.y=cop.heading;
    cop.m.userData.wheels.forEach(w=>w.rotation.x+=cop.speed*0.55);

    if(dist<5.5){
      ps.stunFrames=70; ps.speed*=-0.4;
      cop.stun=35;
      shakeAmt=2;
      heat=Math.max(0,heat-12);
      flashBusted();
    }
  }
}

function flashBusted(){
  const el=document.getElementById('busted');
  el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',900);
}

// ── HUD ────────────────────────────────────────────────────────────
const sCanvas=document.getElementById('speedo-canvas');
const sCtx   =sCanvas.getContext('2d');
const mmCvs  =document.getElementById('minimap');
const mmCtx  =mmCvs.getContext('2d');

function updateHUD(spRatio){
  const kmh=Math.round(spRatio*220);
  document.getElementById('km-display').textContent=kmh+' km/h';
  drawSpeedo(kmh);
  document.getElementById('heat-fill').style.cssText=`width:${heat}%;background:hsl(${120-heat*1.2},100%,50%)`;
  document.getElementById('nitro-fill').style.width=(ps.nitro*100)+'%';
  drawMinimap();
}

function drawSpeedo(kmh){
  const W=150,H=150,cx=75,cy=75,r=60;
  sCtx.clearRect(0,0,W,H);
  sCtx.beginPath();
  sCtx.arc(cx,cy,r,0,Math.PI*2);
  sCtx.fillStyle='rgba(0,0,0,0.75)';
  sCtx.fill();
  sCtx.strokeStyle='rgba(255,90,0,0.5)';
  sCtx.lineWidth=2; sCtx.stroke();

  // Tick marks + labels
  for(let v=0;v<=220;v+=20){
    const a=(Math.PI*0.75)+(v/220)*(Math.PI*1.5);
    sCtx.beginPath();
    sCtx.moveTo(cx+Math.cos(a)*r*0.72, cy+Math.sin(a)*r*0.72);
    sCtx.lineTo(cx+Math.cos(a)*r*0.88, cy+Math.sin(a)*r*0.88);
    sCtx.strokeStyle='#fff'; sCtx.lineWidth=v%40===0?2.5:1; sCtx.stroke();
    if(v%40===0){
      sCtx.fillStyle='#ddd'; sCtx.font='bold 10px Arial'; sCtx.textAlign='center'; sCtx.textBaseline='middle';
      sCtx.fillText(v, cx+Math.cos(a)*r*0.58, cy+Math.sin(a)*r*0.58);
    }
  }

  // Needle
  const na=(Math.PI*0.75)+(kmh/220)*(Math.PI*1.5);
  sCtx.beginPath();
  sCtx.moveTo(cx-Math.cos(na)*r*0.15, cy-Math.sin(na)*r*0.15);
  sCtx.lineTo(cx+Math.cos(na)*r*0.72, cy+Math.sin(na)*r*0.72);
  sCtx.strokeStyle='#ff6600'; sCtx.lineWidth=3; sCtx.lineCap='round'; sCtx.stroke();

  sCtx.beginPath();
  sCtx.arc(cx,cy,r*0.1,0,Math.PI*2);
  sCtx.fillStyle='#ff6600'; sCtx.fill();
}

function drawMinimap(){
  const W=120,H=120;
  mmCtx.clearRect(0,0,W,H);
  mmCtx.fillStyle='rgba(0,0,0,0.75)'; mmCtx.fillRect(0,0,W,H);
  const scale=W/CITY;
  const ox=W/2, oz=H/2;
  // Roads (faint lines)
  mmCtx.strokeStyle='rgba(255,255,255,0.15)'; mmCtx.lineWidth=2;
  const off=-HALF_CITY, period=BLOCK+ROAD;
  for(let r=0;r<=BLOCKS;r++){
    const rz=(off+r*period+ROAD/2)*scale+oz;
    mmCtx.beginPath(); mmCtx.moveTo(0,rz); mmCtx.lineTo(W,rz); mmCtx.stroke();
  }
  for(let c=0;c<=BLOCKS;c++){
    const rx=(off+c*period+ROAD/2)*scale+ox;
    mmCtx.beginPath(); mmCtx.moveTo(rx,0); mmCtx.lineTo(rx,H); mmCtx.stroke();
  }
  // Cops
  cops.forEach(cop=>{
    const cx=cop.m.position.x*scale+ox, cz=cop.m.position.z*scale+oz;
    mmCtx.beginPath(); mmCtx.arc(cx,cz,3,0,Math.PI*2);
    mmCtx.fillStyle='#4488ff'; mmCtx.fill();
  });
  // Player
  const px2=ps.pos.x*scale+ox, pz2=ps.pos.z*scale+oz;
  mmCtx.save();
  mmCtx.translate(px2,pz2);
  mmCtx.rotate(-ps.heading);
  mmCtx.beginPath(); mmCtx.moveTo(0,-6); mmCtx.lineTo(-4,4); mmCtx.lineTo(4,4); mmCtx.closePath();
  mmCtx.fillStyle='#ff6600'; mmCtx.fill();
  mmCtx.restore();
  // Border
  mmCtx.strokeStyle='rgba(255,100,0,0.5)'; mmCtx.lineWidth=1; mmCtx.strokeRect(0,0,W,H);
}

function updateStarsUI(){
  document.querySelectorAll('.star').forEach((s,i)=>{
    s.style.color=i<wanted?'#ffcc00':'#333';
    s.style.textShadow=i<wanted?'0 0 8px #ffcc00':'none';
  });
}

// ── GAME LOOP ──────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  if(!gameGoing)return;
  if(shakeAmt>0){
    camera.position.x+=(Math.random()-0.5)*shakeAmt;
    camera.position.y+=(Math.random()-0.5)*shakeAmt;
    shakeAmt*=0.82;
  }
  updatePlayer();
  updateCops();
  renderer.render(scene, camera);
}

function startGame(){
  gameGoing=true;
  document.getElementById('splash').style.display='none';
  startAudio();
  camPos.set(0, CAM_HEIGHT, -CAM_BACK);
  camera.position.copy(camPos);
}

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('start-btn').addEventListener('touchstart',e=>{e.preventDefault();startGame();},{passive:false});

// Show the right control hint
if(isMobile){
  document.getElementById('ctrl-hint').innerHTML=
    'LEFT THUMB: JOYSTICK (steer + gas/brake)<br>RIGHT THUMB: GAS · BRAKE · N2O';
}

// ── BOOT ───────────────────────────────────────────────────────────
buildCity();
initPlayer();
initTouch();
requestAnimationFrame(loop);
</script>
